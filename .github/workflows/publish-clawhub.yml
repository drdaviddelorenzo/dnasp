# Publishes skills/dnasp/ to ClawHub at the version recorded in the skill. MANUAL ONLY, and not
# to be run before a validated release.
#
# This repository packages the dnasp skill and is refreshed at each validated release. ClawHub
# and Hermes are both fed from it:
#   - ClawHub  <- this workflow
#   - Hermes   <- `hermes skills tap add drdaviddelorenzo/dnasp`, which reads skills/
# so `skills/` is the layout both registries expect. Do not move it.
#
# Why not ClawHub's reusable skill-publish.yml: at v0.23.3 it runs `clawhub skill publish`
# without --version, so a new skill is published as 1.0.0 and every later change as the next
# patch, whatever SKILL.md says. The ClawHub web importer numbers versions the same way. This
# workflow runs the same pinned ClawHub CLI, but (see .github/scripts/):
#   1. requires SKILL.md `version` and `metadata.version`, `__version__` in dnasp.py and the
#      latest CHANGELOG.md entry to agree, and that entry to be dated for a real publish;
#   2. asks ClawHub, without uploading, whether this exact content is already stored. Under the
#      same version the run succeeds only if ClawHub lists it as published and lets it be
#      downloaded, and otherwise
#      says whether it is still under security checks or was blocked; under a different version
#      it stops. Identical content is never uploaded twice, so re-runs are safe;
#   3. refuses a version that is not greater than ClawHub's latest;
#   4. publishes with --version set to the recorded version, then waits up to ten minutes for
#      ClawHub to list it as published and let it be downloaded. A release still under checks,
#      or blocked, fails the run.
#
# Real publishes need the repository secret CLAWHUB_TOKEN: obtain a token with
# `clawhub login --device` and add it under Settings > Secrets and variables > Actions.
# Always run a dry run first.

name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, no publish
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-clawhub
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SKILL_PATH: skills/dnasp
      OWNER: drdaviddelorenzo
      REGISTRY: https://clawhub.ai
      SITE: https://clawhub.ai
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "pyyaml==6.0.2"

      - name: Check the release version
        id: release
        run: python .github/scripts/clawhub_release_version.py

      - name: Check out the ClawHub CLI (v0.23.3)
        uses: actions/checkout@v4
        with:
          repository: openclaw/clawhub
          # The commit behind tag v0.23.3, pinned so a moved tag cannot change what runs here.
          ref: 87ca030c30f3cfb78ab15c8e66b5ff1469c8f9c8
          path: .clawhub-cli
          persist-credentials: false

      # Same Bun pin as ClawHub's own skill-publish.yml at v0.23.3.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install ClawHub CLI dependencies
        working-directory: .clawhub-cli
        run: bun install --frozen-lockfile

      - name: Write ClawHub config
        if: ${{ !inputs.dry_run }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::A real publish needs the CLAWHUB_TOKEN repository secret."
            exit 1
          fi
          python - <<'EOF'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          path.write_text(json.dumps({"registry": os.environ["REGISTRY"], "token": os.environ["CLAWHUB_TOKEN"]}) + "\n", encoding="utf-8")
          path.chmod(0o600)
          EOF
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Publish at the recorded version
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CLI_ENTRY: .clawhub-cli/packages/clawhub/src/cli.ts
        run: python .github/scripts/clawhub_publish.py
